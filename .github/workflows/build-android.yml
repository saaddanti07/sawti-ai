# بناء تطبيق NABRA AI (نَبْرَة AI) لأندرويد باستخدام GitHub Actions
#
# - عند كل push إلى main أو pull_request يتم بناء APK تجريبي (debug) ورفعه كـ artifact.
# - لبناء نسخة موقعة (release) فعّل خيار "Build signed release" عند التشغيل اليدوي (workflow_dispatch)
#   بعد ضبط الأسرار (Secrets) الأربعة المطلوبة في إعدادات المستودع:
#     ANDROID_KEYSTORE_BASE64    : ملف keystore بصيغة Base64 (محتوى release.jks)
#     ANDROID_KEYSTORE_PASSWORD  : كلمة مرور keystore (storePassword)
#     ANDROID_KEY_ALIAS          : اسم المفتاح (alias)
#     ANDROID_KEY_PASSWORD       : كلمة مرور المفتاح (keyPassword)
#   لا تُنشئ مفاتيح وهمية — استخدم مفتاحاً حقيقياً أنشأته بنفسك، ولا تلتزم الملف ولا كلمات المرور.

name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'بناء نسخة موقعة (release) — يتطلب ضبط الأسرار الأربعة'
        required: false
        default: false
        type: boolean

jobs:
  build-debug:
    name: بناء APK تجريبي (Debug)
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: إعداد Android SDK (المثبت مسبقاً على Runner)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/build-tools/36.0.0" >> $GITHUB_PATH

      - name: قبول تراخيص Android SDK وتثبيت المكونات المطلوبة
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: تثبيت اعتماديات المشروع
        run: npm ci

      - name: بناء واجهة الويب ومزامنة Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: بناء APK تجريبي
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: رفع APK كـ artifact
        uses: actions/upload-artifact@v4
        with:
          name: sawti-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  build-release:
    name: بناء نسخة موقعة (Release)
    runs-on: ubuntu-latest
    needs: build-debug
    if: github.event_name == 'workflow_dispatch' && inputs.build_release == true
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: إعداد Android SDK (المثبت مسبقاً على Runner)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/build-tools/36.0.0" >> $GITHUB_PATH

      - name: قبول تراخيص Android SDK وتثبيت المكونات المطلوبة
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: تثبيت اعتماديات المشروع
        run: npm ci

      - name: بناء واجهة الويب ومزامنة Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: التحقق من وجود أسرار التوقيع
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::السر ANDROID_KEYSTORE_BASE64 غير مضبوط — أنشئ keystore وحوله إلى Base64 ثم أضفه في Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then
            echo "::error::السر ANDROID_KEYSTORE_PASSWORD غير مضبوط"
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            echo "::error::السر ANDROID_KEY_ALIAS غير مضبوط"
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "::error::السر ANDROID_KEY_PASSWORD غير مضبوط"
            exit 1
          fi
          echo "جميع أسرار التوقيع موجودة."

      - name: إعداد بيئة التوقيع (فك تشفير Keystore)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_VAL: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          # فك تشفير Keystore إلى موقع مؤقت آمن (لا يُلتزم)
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          if [ ! -s "$RUNNER_TEMP/release.keystore" ]; then
            echo "::error::فشل فك تشفير Keystore — الملف فارغ أو Base64 غير صحيح"
            exit 1
          fi
          echo "Keystore decoded to $RUNNER_TEMP/release.keystore (size $(stat -c%s "$RUNNER_TEMP/release.keystore") bytes)"

          # حقن إعدادات التوقيع في gradle.properties (مؤقت، لا يُلتزم)
          # android/app/build.gradle يقرأ storeFile/storePassword/keyAlias/keyPassword من project properties
          {
            echo ""
            echo "# Release signing injected by GitHub Actions (temporary)"
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$KEY_ALIAS_VAL"
            echo "keyPassword=$KEY_PASS"
          } >> android/gradle.properties

          echo "Signing properties injected into android/gradle.properties (masked)"
          # لا تطبع كلمات المرور — فقط تأكد من وجود الخاصية دون إظهار القيمة
          if ! grep -q "^storeFile=" android/gradle.properties; then
            echo "::error::فشل حقن storeFile"
            exit 1
          fi
          echo "Signing environment ready (secrets masked, not printed)"

      - name: بناء APK موقع (Release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: التحقق من توقيع APK (apksigner)
        run: |
          set -e
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::لم يتم العثور على APK الموقع في $APK"
            ls -R android/app/build/outputs || true
            exit 1
          fi
          echo "APK found: $APK ($(du -h "$APK" | cut -f1))"
          echo "Verifying signature with apksigner..."
          # apksigner موجود في build-tools/36.0.0 (أضيف إلى PATH سابقاً)
          if ! command -v apksigner >/dev/null 2>&1; then
            echo "apksigner not in PATH, trying explicit path"
            APKSIGNER="/usr/local/lib/android/sdk/build-tools/36.0.0/apksigner"
          else
            APKSIGNER="apksigner"
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "✓ APK signature verification passed"
          # إظهار معلومات إضافية دون كشف أسرار
          ls -lh "$APK"
          echo "APK path: $APK"

      - name: تنظيف Keystore المؤقت
        if: always()
        run: |
          shred -u "$RUNNER_TEMP/release.keystore" 2>/dev/null || rm -f "$RUNNER_TEMP/release.keystore" || true
          echo "Temporary keystore cleaned"

      - name: رفع APK الموقع كـ artifact
        uses: actions/upload-artifact@v4
        with:
          name: sawti-ai-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
