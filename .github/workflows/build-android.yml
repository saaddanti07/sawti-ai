# بناء تطبيق NABRA AI (نَبْرَة AI) لأندرويد باستخدام GitHub Actions
#
# - عند كل push إلى main أو تشغيل يدوي (workflow_dispatch) يتم بناء APK تجريبي (debug)
#   ورفعه كـ artifact قابل للتنزيل.
# - لبناء نسخة موقعة (release) فعّل خيار "Build signed release" عند التشغيل اليدوي
#   بعد ضبط الأسرار (Secrets) التالية في إعدادات المستودع:
#     ANDROID_KEYSTORE_BASE64 : ملف keystore بصيغة Base64
#     KEYSTORE_PASSWORD       : كلمة مرور keystore
#     KEY_ALIAS               : اسم المفتاح (alias)
#     KEY_PASSWORD            : كلمة مرور المفتاح
#   لا تُنشئ مفاتيح وهمية — استخدم مفتاحاً حقيقياً أنشأته بنفسك.

name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'بناء نسخة موقعة (release) — يتطلب ضبط الأسرار'
        required: false
        default: false
        type: boolean

jobs:
  build-debug:
    name: بناء APK تجريبي (Debug)
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: إعداد Android SDK (المثبت مسبقاً على Runner)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/build-tools/36.0.0" >> $GITHUB_PATH

      - name: قبول تراخيص Android SDK وتثبيت المكونات المطلوبة
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: تثبيت اعتماديات المشروع
        run: npm ci

      - name: بناء واجهة الويب ومزامنة Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: بناء APK تجريبي
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: رفع APK كـ artifact
        uses: actions/upload-artifact@v4
        with:
          name: sawti-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  build-release:
    name: بناء نسخة موقعة (Release)
    runs-on: ubuntu-latest
    needs: build-debug
    if: github.event_name == 'workflow_dispatch' && inputs.build_release == true
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: إعداد Android SDK (المثبت مسبقاً على Runner)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/build-tools/36.0.0" >> $GITHUB_PATH

      - name: قبول تراخيص Android SDK وتثبيت المكونات المطلوبة
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: تثبيت اعتماديات المشروع
        run: npm ci

      - name: بناء واجهة الويب ومزامنة Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: استعادة ملف التوقيع من الأسرار
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          echo "storeFile=release.keystore" >> android/gradle.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/gradle.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/gradle.properties

      - name: بناء AAB موقع (Release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: رفع AAB كـ artifact
        uses: actions/upload-artifact@v4
        with:
          name: sawti-ai-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
